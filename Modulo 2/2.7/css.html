<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
    /* Escreva seu código CSS Aqui */

  </style>

  <title>Box Model Practice</title>

  <style>
    div {
      width: 200px;
      height: 200px;
    }

    .first {
      background-color: rgb(102, 39, 218);
      padding: 20px;
      border: 10px solid rgb(0, 0, 0);
    }

    .first p {
      margin: 0;
    }

    .second {
      background-color: rgb(15, 0, 221);
      border-top: 20px solid rgb(0, 0, 0);
      border-bottom: 20px solid rgb(0, 0, 0);
      border-left: 10px solid rgb(0, 0, 0);
      border-right: 10px solid rgb(0, 0, 0);

      margin-left: 260px;
    }

    .third {
      background-color: rgb(57, 19, 192);
      border: 10px solid black;

      margin-left: 40px;
    }
  </style>
</head>

<body>
  <div class="first">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam at sapien
      porttitor urna elementum lacinia. In id magna pulvinar, ultricies lorem
      id, vehicula elit. Aliquam eu luctus nisl, vitae pellentesque magna.
      Phasellus dolor metus, laoreet ac convallis sit amet, efficitur sed dolor.
    </p>
  </div>

  <div class="second"></div>

  <div class="third"></div>
</body>
